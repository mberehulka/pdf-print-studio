# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build the Windows binary
# and publish it as a GitHub release. The in-app updater downloads the attached .exe.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/pdfprintstudio.exe
          generate_release_notes: true
