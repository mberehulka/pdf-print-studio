[package]
name = "pdf-print-studio"
version = "0.1.0"
edition = "2021"
description = "Advanced PDF printing tool with Explorer context-menu integration"
repository = "https://github.com/mberehulka/pdf-print-studio"

[[bin]]
name = "pdfprintstudio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
winreg = "0.52"
raw-window-handle = "0.6"
ureq = { version = "3", features = ["json"] }
windows = { version = "0.58", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Graphics_Imaging",
    "Win32_System_WinRT",
    "Win32_Globalization",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
